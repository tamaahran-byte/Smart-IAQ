<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart IAQ Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; color: #38bdf8; margin-bottom: 4px; }
    .header p { color: #94a3b8; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 18px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
    .card h3 { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
    .card .val { font-size: 28px; font-weight: bold; }
    .card .unit { font-size: 12px; color: #64748b; margin-top: 4px; }
    .safe { color: #4ade80 !important; }
    .danger { color: #f87171 !important; }
    .active { color: #fbbf24 !important; }
    .connection-status { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; font-size: 13px; }
    .connection-status.online { color: #4ade80; }
    .connection-status.offline { color: #f87171; }
    .connection-status.checking { color: #fbbf24; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
    .last-update { margin-top: 5px; color: #94a3b8; font-size: 12px; }
    .unavailable { color: #94a3b8 !important; }
    .chart-box { background: #1e293b; padding: 18px; border-radius: 10px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Indoor Air Quality Dashboard</h1>
    <p>Supabase Sensor Database</p>
    <div id="connectionStatus" class="connection-status checking" role="status" aria-live="polite">
      <span class="status-dot"></span>
      <span id="connectionMessage">Memeriksa koneksi ESP8266...</span>
    </div>
    <p id="lastUpdate" class="last-update"></p>
  </div>
  <div class="grid">
    <div class="card">
      <h3>Suhu Udara</h3>
      <div id="temp" class="val">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card">
      <h3>Kelembapan</h3>
      <div id="hum" class="val">--</div>
      <div class="unit">% RH</div>
    </div>
    <div class="card">
      <h3>Debu PM2.5</h3>
      <div id="pm25" class="val">--</div>
      <div class="unit">µg/m³</div>
    </div>
    <div class="card">
      <h3>Status Gas</h3>
      <div id="gas" class="val safe">AMAN</div>
      <div class="unit">MQ-135</div>
    </div>
    <div class="card">
      <h3>Kipas Pendingin</h3>
      <div id="fan" class="val safe">MATI</div>
      <div class="unit">Relay Pin D2 (Suhu > 34.0°C)</div>
    </div>
  </div>
  <div class="chart-box">
    <canvas id="realtimeChart"></canvas>
  </div>
  <script>
    const ctx = document.getElementById('realtimeChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'PM2.5 (µg/m³)', data: [], borderColor: '#38bdf8', tension: 0.3 },
          { label: 'Suhu (°C)', data: [], borderColor: '#f87171', tension: 0.3 }
        ]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    const SUPABASE_URL = "https://hocbiajsvjkupvxgkkvc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_dg-AjSEi9bVJJO02yagGMA_WaJzpJ9Z";
    const OFFLINE_THRESHOLD_MS = 60000;

    function setConnectionStatus(state, message, lastUpdate = "") {
      const status = document.getElementById('connectionStatus');
      status.className = `connection-status ${state}`;
      document.getElementById('connectionMessage').innerText = message;
      document.getElementById('lastUpdate').innerText = lastUpdate;
    }

    function clearSensorData() {
      document.getElementById('temp').innerText = "--";
      document.getElementById('hum').innerText = "--";
      document.getElementById('pm25').innerText = "--";
      document.getElementById('gas').innerText = "--";
      document.getElementById('gas').className = "val unavailable";
      document.getElementById('fan').innerText = "--";
      document.getElementById('fan').className = "val unavailable";
      chart.data.labels = [];
      chart.data.datasets.forEach(dataset => { dataset.data = []; });
      chart.update();
    }

    async function updateData() {
      if (SUPABASE_URL.includes("YOUR_PROJECT_REF") || SUPABASE_ANON_KEY.startsWith("GANTI_")) {
        clearSensorData();
        setConnectionStatus('checking', 'Supabase belum dikonfigurasi');
        return;
      }

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/sensor_readings?select=created_at,temperature,humidity,pm25,gas,fan&order=created_at.desc&limit=10`,
          {
            cache: 'no-store',
            headers: {
              apikey: SUPABASE_ANON_KEY
            }
          }
        );
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const readings = await response.json();
        if (readings.length === 0) {
          clearSensorData();
          setConnectionStatus('offline', 'Menunggu data pertama dari ESP8266');
          return;
        }

        const latest = readings[0];
        const lastSeen = Date.parse(latest.created_at);
        const ageMs = Date.now() - lastSeen;
        if (!Number.isFinite(lastSeen) || ageMs > OFFLINE_THRESHOLD_MS) {
          clearSensorData();
          setConnectionStatus(
            'offline',
            'ESP8266 offline atau tidak mengirim data',
            Number.isFinite(lastSeen) ? `Data terakhir: ${new Date(lastSeen).toLocaleString()}` : ''
          );
          return;
        }

        setConnectionStatus('online', 'ESP8266 terhubung ke internet', 'Data sensor terbaru diterima');
        document.getElementById('temp').innerText = Number(latest.temperature).toFixed(1);
        document.getElementById('hum').innerText = Math.round(Number(latest.humidity));
        document.getElementById('pm25').innerText = Number(latest.pm25).toFixed(1);

        const gasElem = document.getElementById('gas');
        if (Number(latest.gas) === 1) {
          gasElem.innerText = "BAHAYA!";
          gasElem.className = "val danger";
        } else {
          gasElem.innerText = "AMAN";
          gasElem.className = "val safe";
        }

        const fanElem = document.getElementById('fan');
        if (Number(latest.fan) === 1) {
          fanElem.innerText = "NYALA";
          fanElem.className = "val active";
        } else {
          fanElem.innerText = "MATI";
          fanElem.className = "val safe";
        }

        const chronologicalReadings = readings.slice().reverse();
        chart.data.labels = chronologicalReadings.map(reading => new Date(reading.created_at).toLocaleTimeString());
        chart.data.datasets[0].data = chronologicalReadings.map(reading => Number(reading.pm25));
        chart.data.datasets[1].data = chronologicalReadings.map(reading => Number(reading.temperature));
        chart.update();
      } catch (err) {
        console.error("Error fetching Supabase data:", err);
        clearSensorData();
        setConnectionStatus('offline', 'Gagal membaca data dari Supabase');
      }
    }

    setInterval(updateData, 5000);
    updateData();
  </script>
</body>
</html>
